name: Publish example

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      # example/_extensions is gitignored (it is a local install copy), so
      # install the extension from this checkout before rendering.
      - name: Install extension into example
        run: |
          mkdir -p example/_extensions
          cp -R _extensions/revealjs-anime example/_extensions/

      - name: Render example
        run: quarto render example/example.qmd

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R example/example.html example/example_files example/example.js _site/
          cp _site/example.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
